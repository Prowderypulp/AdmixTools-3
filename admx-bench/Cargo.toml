[package]
name = "admx-bench"
edition.workspace = true
version.workspace = true

[dependencies]
rand = { workspace = true }
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[[bin]]
name = "admx-gen"
path = "src/bin/gen.rs"

[[bin]]
name = "admx-parity"
path = "src/bin/parity.rs"

[[bin]]
name = "admx-timebench"
path = "src/bin/timebench.rs"
